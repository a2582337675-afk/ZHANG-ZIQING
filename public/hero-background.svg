<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="0.42" stop-color="#070A10"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7D5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FE7D5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7FE7D5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.78" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#9FB7FF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#7FE7D5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="white" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;64 0;0 0" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <g opacity="0.7">
    <rect x="0" y="-140" width="1600" height="280" fill="url(#scan)">
      <animate attributeName="y" values="-180;820;-180" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="white" opacity="0.1">
    <circle cx="180" cy="130" r="2">
      <animate attributeName="cy" values="130;760;130" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="360" r="1.5">
      <animate attributeName="cy" values="360;120;360" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="210" r="1.5">
      <animate attributeName="cy" values="210;720;210" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="680" r="2">
      <animate attributeName="cy" values="680;160;680" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1440" cy="250" r="1.5">
      <animate attributeName="cy" values="250;780;250" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="none" stroke="#9FB7FF" stroke-opacity="0.24">
    <rect x="990" y="178" width="300" height="190" rx="8">
      <animate attributeName="x" values="990;1030;990" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1042" y="230" width="230" height="132" rx="8">
      <animate attributeName="x" values="1042;1010;1042" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1130" y="410" width="360" height="220" rx="8">
      <animate attributeName="y" values="410;380;410" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g filter="url(#soft)" opacity="0.4">
    <ellipse cx="1290" cy="170" rx="180" ry="82" fill="#7FE7D5" fill-opacity="0.12">
      <animate attributeName="rx" values="180;230;180" dur="10s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
